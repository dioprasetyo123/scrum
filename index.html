<!DOCTYPE html>
<html>
<head>
    <title>Daftar Mahasiswa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1>Daftar Mahasiswa</h1>
    <a href="{% url 'tambah' %}" class="btn btn-primary mb-3">Tambah Mahasiswa</a>
    <table class="table table-bordered">
        <thead><tr><th>NIM</th><th>Nama</th><th>Jurusan</th><th>Aksi</th></tr></thead>
        <tbody>
            {% for m in data %}
            <tr>
                <td>{{ m.nim }}</td>
                <td>{{ m.nama }}</td>
                <td>{{ m.jurusan }}</td>
                <td>
                    <a href="{% url 'edit' m.id %}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{% url 'hapus' m.id %}" class="btn btn-danger btn-sm">Hapus</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
